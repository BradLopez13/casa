<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Nido symbol master (mono), variant B ("ganchos"), redrawn 18 October 2026.
       Two people of the same size: round heads (r72) at the same level, 24 units clear of the bodies.
       Each body is a hook (top bar, thick outer column and a base reaching the centre line), mirrored,
       and together they wrap an elliptical hollow (centre 256,336; rx118 ry60) that opens upwards
       through a 68-unit gap. Outer corners r88 top, r148 bottom. -->
  <g id="left" fill="currentColor">
    <!-- left head -->
    <circle cx="128" cy="96" r="72"/>
    <!-- left body: in one ink the base stops at x244, a 24-unit seam (r10 bottom corners) short of
         the right figure's base so the two people stay apart -->
    <path d="M8 280A88 88 0 0 1 96 192L192 192A30 30 0 0 1 222 222L222 278.54A118 60 0 0 0 244 395.69L244 478A10 10 0 0 1 234 488L156 488A148 148 0 0 1 8 340Z"/>
  </g>
  <g id="right" fill="currentColor">
    <!-- right head -->
    <circle cx="384" cy="96" r="72"/>
    <!-- right body: mirrored hook; its base starts at x268 on the other side of the seam -->
    <path d="M504 280A88 88 0 0 0 416 192L320 192A30 30 0 0 0 290 222L290 278.54A118 60 0 0 1 268 395.69L268 478A10 10 0 0 0 278 488L356 488A148 148 0 0 0 504 340Z"/>
  </g>
</svg>
