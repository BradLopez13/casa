name: CI

on:
  push:
    branches: [main]
  # Solo los PR hacia main pasan el CI; los de las fases hacia integracion entran sin esperar.
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    env:
      # Placeholders so the bundle can import the Supabase client; no real project or secrets.
      EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
      EXPO_PUBLIC_SUPABASE_KEY: ci-placeholder
      # No Sentry token in CI: skip the source map upload.
      SENTRY_DISABLE_AUTO_UPLOAD: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm expo export --platform android --output-dir dist/android
      - run: pnpm expo export --platform ios --output-dir dist/ios

  db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0
      - run: supabase db start
      - run: supabase test db
      - run: pnpm gen:recurrence-tests && git diff --exit-code supabase/tests/recurrence_cases.test.sql
      - run: pnpm gen:normalize-tests && git diff --exit-code supabase/tests/normalize_cases.test.sql
      - run: pnpm db:types && git diff --exit-code data/supabase/database.types.ts

  # Whether the e2e jobs are worth running: not when only docs, Markdown or unit tests changed.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # A file counts only when it matches every pattern: anything but the ignored ones.
          predicate-quantifier: every
          filters: |
            e2e:
              - '**'
              - '!docs/**'
              - '!**/*.md'
              - '!**/*.test.ts'
              - '!**/*.test.tsx'
              - '!supabase/tests/**'

  # Built once, in parallel with app and db, and shared by every e2e shard.
  build-apk:
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # The APK embeds the local Supabase key, which `supabase status` only prints with the API
      # up. It comes up in the background while the job installs the rest. The key comes from
      # config.toml, so every shard's stack hands out the same one (each shard checks it).
      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0
      - run: bash scripts/ci-supabase.sh start
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: pnpm install --frozen-lockfile
      - name: Wait for local Supabase
        run: bash scripts/ci-supabase.sh wait
      - run: pnpm e2e:env

      - name: Build the release APK
        env:
          E2E: '1'
          SENTRY_DISABLE_AUTO_UPLOAD: 'true'
        run: |
          set -a; . ./.env.e2e; set +a
          pnpm expo prebuild --platform android --clean
          cd android && ./gradlew assembleRelease -PreactNativeArchitectures=x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: e2e-apk
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            .env.e2e
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: error

  e2e-android:
    needs: [app, db, build-apk]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # One job per shard of scripts/e2e-shard.sh, which lists the flows of each.
        shard: [1, 2, 3]
    name: e2e-android (${{ matrix.shard }})
    steps:
      - uses: actions/checkout@v4
      # Supabase comes up in the background while the job installs and boots the emulator.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0
      - run: bash scripts/ci-supabase.sh start
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: List the shard's flows
        run: bash scripts/e2e-shard.sh ${{ matrix.shard }}

      - uses: actions/download-artifact@v4
        with:
          name: e2e-apk
          path: e2e-apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Maestro
        run: |
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # The runner's command-line tools predate SDK XML v4, and their avdmanager crashes
      # ("hwMap is null") creating the AVD. Install the latest ones in their place first.
      - name: Update Android command-line tools
        run: |
          tools="$ANDROID_HOME/cmdline-tools"
          yes | "$tools/latest/bin/sdkmanager" --install 'cmdline-tools;latest' > /dev/null
          if [ -d "$tools/latest-2" ]; then
            rm -rf "$tools/latest"
            mv "$tools/latest-2" "$tools/latest"
          fi
          "$tools/latest/bin/sdkmanager" --version

      # Each script line runs on its own and the first failing one stops it.
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            bash scripts/ci-supabase.sh wait
            pnpm e2e:fixtures
            pnpm e2e:env
            cmp .env.e2e e2e-apk/.env.e2e || { echo "The APK was built for another Supabase key"; exit 1; }
            adb install e2e-apk/android/app/build/outputs/apk/release/app-release.apk
            bash scripts/e2e-locale.sh es true
            set -a; . ./.env.e2e; set +a; maestro test -e SUPABASE_KEY="$EXPO_PUBLIC_SUPABASE_KEY" $(bash scripts/e2e-shard.sh ${{ matrix.shard }}) --format junit --output e2e-report.xml
            if [ "${{ matrix.shard }}" = 1 ]; then set -a; . ./.env.e2e; set +a; bash scripts/e2e-locale.sh en maestro test -e SUPABASE_KEY="$EXPO_PUBLIC_SUPABASE_KEY" $(bash scripts/e2e-shard.sh english) --format junit --output e2e-report-english.xml; fi

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-android-report-${{ matrix.shard }}
          path: |
            e2e-report.xml
            e2e-report-english.xml
            ~/.maestro/tests/
          if-no-files-found: ignore
