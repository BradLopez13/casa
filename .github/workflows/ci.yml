name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    env:
      # Placeholders so the bundle can import the Supabase client; no real project or secrets.
      EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
      EXPO_PUBLIC_SUPABASE_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm expo export --platform android --output-dir dist/android
      - run: pnpm expo export --platform ios --output-dir dist/ios

  db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0
      - run: supabase db start
      - run: supabase test db
      - run: pnpm gen:recurrence-tests && git diff --exit-code supabase/tests/recurrence_cases.test.sql
      - run: pnpm gen:normalize-tests && git diff --exit-code supabase/tests/normalize_cases.test.sql
      - run: pnpm db:types && git diff --exit-code data/supabase/database.types.ts

  e2e-android:
    needs: [app, db]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: pnpm install --frozen-lockfile

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0
      - name: Start local Supabase
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,postgres-meta,mailpit
      - run: pnpm e2e:fixtures
      - run: pnpm e2e:env

      - name: Build the release APK
        env:
          E2E: '1'
        run: |
          set -a; . ./.env.e2e; set +a
          pnpm expo prebuild --platform android --clean
          cd android && ./gradlew assembleRelease -PreactNativeArchitectures=x86_64

      - name: Install Maestro
        run: |
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb install android/app/build/outputs/apk/release/app-release.apk
            set -a; . ./.env.e2e; set +a; maestro test -e SUPABASE_KEY="$EXPO_PUBLIC_SUPABASE_KEY" e2e/ --format junit --output e2e-report.xml

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-android-report
          path: |
            e2e-report.xml
            ~/.maestro/tests/
          if-no-files-found: ignore
