# Publishes site/ (the privacy policy the store listings link to) on GitHub Pages.
name: pages

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # The store links of the landing and the invitation page come from the repository's
      # variables (Settings → Secrets and variables → Actions → Variables): APP_STORE_ID (the
      # number of apps.apple.com/app/id…) and PLAY_URL (the listing, or the closed-test opt-in
      # link). Empty, the pages say the app is not in that store yet (LANZAMIENTO.md).
      - name: Fill the store links
        env:
          APP_STORE_ID: ${{ vars.APP_STORE_ID }}
          PLAY_URL: ${{ vars.PLAY_URL }}
        run: bash scripts/site-store-links.sh site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
