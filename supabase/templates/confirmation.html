<!doctype html>
<html lang="es">
  <body
    style="
      margin: 0;
      padding: 32px 16px;
      background: #fff6e8;
      font-family: Arial, Helvetica, sans-serif;
      color: #263663;
    "
  >
    <div style="max-width: 420px; margin: 0 auto; text-align: center">
      <h1 style="margin: 0 0 16px; font-size: 24px; color: #263663">Tu código de Nido</h1>
      <p style="margin: 0 0 16px; font-size: 16px; color: #263663">
        Escríbelo en la app para confirmar tu correo:
      </p>
      <p
        style="
          margin: 0 0 16px;
          font-family: 'Courier New', Courier, monospace;
          font-size: 32px;
          font-weight: bold;
          letter-spacing: 6px;
          color: #263663;
        "
      >
        {{ .Token }}
      </p>
      <p style="margin: 0 0 8px; font-size: 14px; color: #263663">Caduca en 15 minutos</p>
      <p style="margin: 0; font-size: 14px; color: #263663">
        Si no lo has pedido tú, ignora este correo
      </p>
    </div>
  </body>
</html>
