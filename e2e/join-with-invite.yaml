appId: com.bradlopez13.casa
---
# Needs the fixtures: EXPIRED_TOKEN = b2 x 24, VALID_TOKEN = a1 x 24 (see supabase/e2e/fixtures.sql).
- clearState
# Android can kill the first start while the cleared task is still being removed: retry it.
- retry:
    maxRetries: 2
    commands:
      - launchApp:
          stopApp: true
      - extendedWaitUntil:
          visible:
            id: sign-in.email
          timeout: 30000

# Sign in as Bob, a fixture user with no household yet
- runFlow:
    file: subflows/sign-in.yaml
    env:
      EMAIL: bob@e2e.dev
- extendedWaitUntil:
    visible:
      id: onboarding.link
    timeout: 20000

# Expired invite: shows the error
- tapOn:
    id: onboarding.link
- inputText: b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2
- hideKeyboard
- tapOn:
    id: onboarding.join
- extendedWaitUntil:
    visible:
      id: invite.accept
    timeout: 20000
# On a small screen the brand header can push this element below the fold.
- scrollUntilVisible:
    element:
      id: invite.accept
- tapOn:
    id: invite.accept
- extendedWaitUntil:
    visible:
      id: invite.error
      text: 'Esta invitación ha caducado.*'
    timeout: 20000

# Back to onboarding, paste the valid link
# On a small screen the brand header can push this element below the fold.
- scrollUntilVisible:
    element:
      id: invite.continue
- tapOn:
    id: invite.continue
- extendedWaitUntil:
    visible:
      id: onboarding.link
    timeout: 20000
- tapOn:
    id: onboarding.link
- eraseText: 100
- inputText: casa://invite?token=a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1
- hideKeyboard
- tapOn:
    id: onboarding.join
- extendedWaitUntil:
    visible:
      id: invite.accept
    timeout: 20000
# On a small screen the brand header can push this element below the fold.
- scrollUntilVisible:
    element:
      id: invite.accept
- tapOn:
    id: invite.accept
- extendedWaitUntil:
    visible:
      id: today.door-line
    timeout: 20000

# Members: Ana and Bob, and no owner actions for Bob
- tapOn:
    id: tab.settings
- tapOn:
    id: settings.members
- extendedWaitUntil:
    visible: Ana
    timeout: 20000
- assertVisible: Bob
- assertNotVisible: Quitar del hogar
- assertNotVisible: Hacer propietario

# Leave the household
- scrollUntilVisible:
    element:
      id: members.leave
- tapOn:
    id: members.leave
- tapOn:
    id: members.confirm
- extendedWaitUntil:
    visible:
      id: onboarding.create
    timeout: 20000
