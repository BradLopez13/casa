appId: com.bradlopez13.casa
---
# Needs the fixtures: EXPIRED_TOKEN = b2 x 24, VALID_TOKEN = a1 x 24 (see supabase/e2e/fixtures.sql).
- clearState
# Android can kill the first start while the cleared task is still being removed: retry it.
- retry:
    maxRetries: 2
    commands:
      - launchApp:
          stopApp: true
      - extendedWaitUntil:
          visible:
            id: sign-in.email
          timeout: 30000
- evalScript: ${output.email = 'bob' + Date.now() + '@e2e.dev'}

# Sign up as Bob
# On a small screen the keyboard or the brand header can leave this field below the fold.
- scrollUntilVisible:
    element:
      id: sign-in.go-sign-up
- tapOn:
    id: sign-in.go-sign-up
- tapOn:
    id: sign-up.name
- inputText: Bob
- tapOn:
    id: sign-up.email
- inputText: ${output.email}
# On a small screen the keyboard or the brand header can leave this field below the fold.
- scrollUntilVisible:
    element:
      id: sign-up.password
- tapOn:
    id: sign-up.password
- inputText: e2e-password-2026
- hideKeyboard
# On a small screen the keyboard or the brand header can leave this field below the fold.
- scrollUntilVisible:
    element:
      id: sign-up.password-confirm
- tapOn:
    id: sign-up.password-confirm
- inputText: e2e-password-2026
- hideKeyboard
- scrollUntilVisible:
    element:
      id: sign-up.submit
- tapOn:
    id: sign-up.submit
- runFlow: subflows/verify-email.yaml
- extendedWaitUntil:
    visible:
      id: onboarding.link
    timeout: 20000

# Expired invite: shows the error
- tapOn:
    id: onboarding.link
- inputText: b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2
- hideKeyboard
- tapOn:
    id: onboarding.join
- extendedWaitUntil:
    visible:
      id: invite.accept
    timeout: 20000
- tapOn:
    id: invite.accept
- extendedWaitUntil:
    visible:
      id: invite.error
      text: 'Esta invitación ha caducado.*'
    timeout: 20000

# Back to onboarding, paste the valid link
- tapOn:
    id: invite.continue
- extendedWaitUntil:
    visible:
      id: onboarding.link
    timeout: 20000
- tapOn:
    id: onboarding.link
- eraseText: 100
- inputText: casa://invite?token=a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1
- hideKeyboard
- tapOn:
    id: onboarding.join
- extendedWaitUntil:
    visible:
      id: invite.accept
    timeout: 20000
- tapOn:
    id: invite.accept
- extendedWaitUntil:
    visible:
      id: today.household-name
      text: Casa E2E
    timeout: 20000

# Members: Ana and Bob, and no owner actions for Bob
- tapOn:
    id: tab.settings
- tapOn:
    id: settings.members
- extendedWaitUntil:
    visible: Ana
    timeout: 20000
- assertVisible: Bob
- assertNotVisible: Quitar del hogar
- assertNotVisible: Hacer propietario

# Leave the household
- scrollUntilVisible:
    element:
      id: members.leave
- tapOn:
    id: members.leave
- tapOn:
    id: members.confirm
- extendedWaitUntil:
    visible:
      id: onboarding.create
    timeout: 20000
