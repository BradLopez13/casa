appId: com.bradlopez13.casa
---
- clearState
# Android can kill the first start while the cleared task is still being removed: retry it.
- retry:
    maxRetries: 2
    commands:
      - launchApp:
          stopApp: true
      - extendedWaitUntil:
          visible:
            id: sign-in.go-sign-up
          timeout: 30000
- evalScript: ${output.email = 'ana' + Date.now() + '@e2e.dev'}

# Sign up
- tapOn:
    id: sign-in.go-sign-up
- tapOn:
    id: sign-up.name
- inputText: Ana
- tapOn:
    id: sign-up.email
- inputText: ${output.email}
- tapOn:
    id: sign-up.password
- inputText: e2e-password-2026
- tapOn:
    id: sign-up.password-confirm
- inputText: e2e-password-2026
- hideKeyboard
- tapOn:
    id: sign-up.submit
- runFlow: subflows/verify-email.yaml
- extendedWaitUntil:
    visible:
      id: onboarding.name
    timeout: 20000

# Sign out, then ask for a recovery code
- tapOn:
    id: onboarding.sign-out
- extendedWaitUntil:
    visible:
      id: sign-in.forgot-password
    timeout: 20000
- tapOn:
    id: sign-in.forgot-password
- tapOn:
    id: forgot-password.email
- inputText: ${output.email}
- hideKeyboard
- tapOn:
    id: forgot-password.send
- extendedWaitUntil:
    visible:
      id: forgot-password.code
    timeout: 15000

# The newest message is now the recovery one
- runScript:
    file: scripts/read-email-code.js
    env:
      EMAIL: ${output.email}
- tapOn:
    id: forgot-password.code
- inputText: ${output.code}
- tapOn:
    id: forgot-password.password
- inputText: e2e-new-2026
- tapOn:
    id: forgot-password.password-confirm
- inputText: e2e-new-2026
- hideKeyboard
- tapOn:
    id: forgot-password.submit
- extendedWaitUntil:
    visible:
      id: onboarding.name
    timeout: 20000

# Sign in again with the new password
- tapOn:
    id: onboarding.sign-out
- extendedWaitUntil:
    visible:
      id: sign-in.email
    timeout: 20000
- tapOn:
    id: sign-in.email
- inputText: ${output.email}
- tapOn:
    id: sign-in.password
- inputText: e2e-new-2026
- hideKeyboard
- tapOn:
    id: sign-in.submit
- extendedWaitUntil:
    visible:
      id: onboarding.name
    timeout: 20000
