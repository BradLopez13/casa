appId: com.bradlopez13.casa
# Runs even when the flow fails: an emulator left offline would break every later flow.
onFlowComplete:
  - setAirplaneMode: disabled
---
- clearState
# Android can kill the first start while the cleared task is still being removed: retry it.
- retry:
    maxRetries: 2
    commands:
      - launchApp:
          stopApp: true
      - extendedWaitUntil:
          visible:
            id: sign-in.email
          timeout: 30000

# Sign in as Olga, a fixture user who already owns "Piso Olga"
- runFlow:
    file: subflows/sign-in.yaml
    env:
      EMAIL: olga@e2e.dev
- extendedWaitUntil:
    visible:
      id: today.household-name
      text: Piso Olga
    timeout: 20000

# Open the list, then lose the connection
- tapOn:
    id: tab.shopping
- extendedWaitUntil:
    visible: Nada por comprar
    timeout: 20000
- setAirplaneMode: enabled
- extendedWaitUntil:
    visible:
      id: shopping.offline
    timeout: 20000

# Add "Huevos" offline: it shows at once, marked as pending
- tapOn:
    id: shopping.input
- inputText: Huevos
- tapOn:
    id: shopping.add
- extendedWaitUntil:
    visible: Huevos
    timeout: 20000
- assertVisible:
    id: shopping.offline
- assertVisible:
    id: shopping.item.*.pending
- hideKeyboard

# Back online: the queue sends it and the pending mark goes away
- setAirplaneMode: disabled
- extendedWaitUntil:
    notVisible:
      id: shopping.item.*.pending
    timeout: 30000
- extendedWaitUntil:
    notVisible:
      id: shopping.offline
    timeout: 20000
- assertNotVisible: No se pudo guardar.*

# A pull to refresh brings it back from the server
- swipe:
    start: 50%, 35%
    end: 50%, 85%
    duration: 800
- extendedWaitUntil:
    visible: Huevos
    timeout: 20000
