appId: com.bradlopez13.casa
# Bloque 14.1 (P1-2 del 1 de noviembre): a task made offline stayed «Sin enviar» with the
# connection back in 3 of 9 tries. One try is not enough: three cycles of airplane mode in a row,
# each with a task made offline, and each time the mark goes once the connection is back.
onFlowComplete:
  - setAirplaneMode: disabled
---
- clearState
- retry:
    maxRetries: 2
    commands:
      - launchApp:
          stopApp: true
      - extendedWaitUntil:
          visible:
            id: sign-in.email
          timeout: 30000
- runFlow:
    file: subflows/sign-in.yaml
    env:
      EMAIL: gala@e2e.dev
- extendedWaitUntil:
    visible:
      id: today.door-line
    timeout: 20000

# Cycle 1
- setAirplaneMode: enabled
- extendedWaitUntil:
    visible:
      id: tasks.offline
    timeout: 20000
- tapOn:
    id: today.quick-add
- inputText: Ciclo uno
- tapOn:
    id: today.quick-add.submit
- hideKeyboard
# The mark goes under the note: on the emulator screen it can fall under the tab bar.
- scrollUntilVisible:
    element:
      id: 'task-note\..*\.pending'
    direction: DOWN
    timeout: 5000
- setAirplaneMode: disabled
- extendedWaitUntil:
    notVisible:
      id: '(task-note|done-tray)\..*\.pending'
    timeout: 30000
- assertNotVisible:
    id: tasks.queue.retry
# The emulator screen holds one note: done, so the next cycle's note is the one in view.
- tapOn: Completar «Ciclo uno»

# Cycle 2: a complete queued behind the create
- setAirplaneMode: enabled
- extendedWaitUntil:
    visible:
      id: tasks.offline
    timeout: 20000
- tapOn:
    id: today.quick-add
- inputText: Ciclo dos
- tapOn:
    id: today.quick-add.submit
- hideKeyboard
# The mark goes under the note: on the emulator screen it can fall under the tab bar.
- scrollUntilVisible:
    element:
      id: 'task-note\..*\.pending'
    direction: DOWN
    timeout: 5000
- tapOn: Completar «Ciclo dos»
- setAirplaneMode: disabled
- extendedWaitUntil:
    notVisible:
      id: '(task-note|done-tray)\..*\.pending'
    timeout: 30000
- assertNotVisible:
    id: tasks.queue.retry

# Cycle 3: the app goes to the background while offline and comes back with the connection
- setAirplaneMode: enabled
- extendedWaitUntil:
    visible:
      id: tasks.offline
    timeout: 20000
- tapOn:
    id: today.quick-add
- inputText: Ciclo tres
- tapOn:
    id: today.quick-add.submit
- hideKeyboard
# The mark goes under the note: on the emulator screen it can fall under the tab bar.
- scrollUntilVisible:
    element:
      id: 'task-note\..*\.pending'
    direction: DOWN
    timeout: 5000
- pressKey: Home
- setAirplaneMode: disabled
# Back to the app as it was, not a cold start: the list is still scrolled down to the mark, so
# the door is out of view and the quick add, still in view, says the app is in front.
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible:
      id: today.quick-add
    timeout: 20000
- extendedWaitUntil:
    notVisible:
      id: '(task-note|done-tray)\..*\.pending'
    timeout: 30000
- assertNotVisible:
    id: tasks.queue.retry

# All three reached the server: a refresh brings them back from it.
- scrollUntilVisible:
    element:
      id: today.door-line
    direction: UP
- swipe:
    start: 50%, 35%
    end: 50%, 85%
    duration: 800
- extendedWaitUntil:
    visible: Ciclo tres
    timeout: 20000
# The first two are done, in the tray under the list.
- scrollUntilVisible:
    element: '.*Ciclo dos.*'
    direction: DOWN
- scrollUntilVisible:
    element: '.*Ciclo uno.*'
    direction: DOWN
- assertNotVisible:
    id: '(task-note|done-tray)\..*\.pending'
