appId: com.bradlopez13.casa
---
- clearState
# Android can kill the first start while the cleared task is still being removed: retry it.
- retry:
    maxRetries: 2
    commands:
      - launchApp:
          stopApp: true
      - extendedWaitUntil:
          visible:
            id: sign-in.email
          timeout: 30000

# Sign in as Leo, a fixture user who already owns "Piso Leo"
- runFlow:
    file: subflows/sign-in.yaml
    env:
      EMAIL: leo@e2e.dev
- extendedWaitUntil:
    visible:
      id: today.household-name
      text: Piso Leo
    timeout: 20000

# Create a task from the modal form (the modal closes with router.back() after saving)
- tapOn:
    id: today.new-task
- extendedWaitUntil:
    visible:
      id: task-form.title
    timeout: 20000
- tapOn:
    id: task-form.title
- inputText: Regar las plantas
- hideKeyboard
- tapOn:
    id: task-form.save
- extendedWaitUntil:
    visible: Regar las plantas
    timeout: 20000
- assertVisible: Para hoy

# Complete it: the note moves to the done tray and the tally follows
- tapOn: Completar «Regar las plantas»
- extendedWaitUntil:
    visible: Hechas hoy
    timeout: 20000
# The scope label shares the same Text (" · En todo el hogar"), so match the prefix.
- assertVisible: 1 de 1 hechas.*

# Reopen it from the tray: it goes back to "Para hoy". The pill also names who did it.
- tapOn: Reabrir «Regar las plantas».*
- extendedWaitUntil:
    visible: Para hoy
    timeout: 20000
- assertVisible: Completar «Regar las plantas»
