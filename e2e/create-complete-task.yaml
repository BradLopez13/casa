appId: com.bradlopez13.casa
---
- clearState
# Android can kill the first start while the cleared task is still being removed: retry it.
- retry:
    maxRetries: 2
    commands:
      - launchApp:
          stopApp: true
      - extendedWaitUntil:
          visible:
            id: sign-in.email
          timeout: 30000

# Sign in as Leo, a fixture user who already owns "Piso Leo"
- runFlow:
    file: subflows/sign-in.yaml
    env:
      EMAIL: leo@e2e.dev
- extendedWaitUntil:
    visible:
      id: today.door-line
    timeout: 20000

# Create a task from the quick add under the door: a plain title goes to today, for me
- tapOn:
    id: today.quick-add
- inputText: Regar las plantas
- tapOn:
    id: today.quick-add.submit
- hideKeyboard
- extendedWaitUntil:
    visible: Regar las plantas
    timeout: 20000
- assertVisible: Para hoy

# Complete it: the note moves to the done tray and the tally follows
- tapOn: Completar «Regar las plantas»
- extendedWaitUntil:
    visible: Hechas hoy
    timeout: 20000
# The only task is done, so the door says the day is finished.
- assertVisible: Todo hecho por hoy.

# Reopen it from the tray: it goes back to "Para hoy". The pill also names who did it.
- tapOn: Reabrir «Regar las plantas».*
- extendedWaitUntil:
    visible: Para hoy
    timeout: 20000
- assertVisible: Completar «Regar las plantas»
