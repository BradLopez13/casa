appId: com.bradlopez13.casa
---
- clearState
# Android can kill the first start while the cleared task is still being removed: retry it.
- retry:
    maxRetries: 2
    commands:
      - launchApp:
          stopApp: true
      - extendedWaitUntil:
          visible:
            id: sign-in.go-sign-up
          timeout: 30000
- evalScript: ${output.email = 'leo' + Date.now() + '@e2e.dev'}

# Sign up
- tapOn:
    id: sign-in.go-sign-up
- tapOn:
    id: sign-up.name
- inputText: Leo
- tapOn:
    id: sign-up.email
- inputText: ${output.email}
- tapOn:
    id: sign-up.password
- inputText: e2e-password-2026
- hideKeyboard
- tapOn:
    id: sign-up.submit

# Onboarding: create the household
- extendedWaitUntil:
    visible:
      id: onboarding.name
    timeout: 20000
- tapOn:
    id: onboarding.name
- eraseText: 60
- inputText: Piso Leo
- hideKeyboard
- tapOn:
    id: onboarding.create
- extendedWaitUntil:
    visible:
      id: today.household-name
      text: Piso Leo
    timeout: 20000

# Create a task from the modal form (the modal closes with router.back() after saving)
- tapOn:
    id: today.new-task
- extendedWaitUntil:
    visible:
      id: task-form.title
    timeout: 20000
- tapOn:
    id: task-form.title
- inputText: Regar las plantas
- hideKeyboard
- tapOn:
    id: task-form.save
- extendedWaitUntil:
    visible: Regar las plantas
    timeout: 20000
- assertVisible: Para hoy

# Complete it: the note moves to the done tray and the tally follows
- tapOn: Completar «Regar las plantas»
- extendedWaitUntil:
    visible: Hechas hoy
    timeout: 20000
# The scope label shares the same Text (" · En toda la casa"), so match the prefix.
- assertVisible: 1 de 1 hechas.*

# Reopen it from the tray: it goes back to "Para hoy"
- tapOn: Reabrir «Regar las plantas»
- extendedWaitUntil:
    visible: Para hoy
    timeout: 20000
- assertVisible: Completar «Regar las plantas»
