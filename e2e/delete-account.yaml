appId: com.bradlopez13.casa
---
- clearState
# Android can kill the first start while the cleared task is still being removed: retry it.
- retry:
    maxRetries: 2
    commands:
      - launchApp:
          stopApp: true
      - extendedWaitUntil:
          visible:
            id: sign-in.email
          timeout: 30000

# Sign in as Ines, a fixture user who already owns "Piso Ines"
- runFlow:
    file: subflows/sign-in.yaml
    env:
      EMAIL: ines@e2e.dev
- extendedWaitUntil:
    visible:
      id: today.household-name
      text: Piso Ines
    timeout: 20000

# Settings -> delete the account -> back to sign in
- tapOn:
    id: tab.settings
- scrollUntilVisible:
    element:
      id: settings.delete-account
- tapOn:
    id: settings.delete-account
- tapOn:
    id: members.confirm
- extendedWaitUntil:
    visible:
      id: sign-in.email
    timeout: 20000

# The deleted account can no longer sign in
- tapOn:
    id: sign-in.email
- inputText: ines@e2e.dev
- tapOn:
    id: sign-in.password
- inputText: e2e-password-2026
- hideKeyboard
- tapOn:
    id: sign-in.submit
- extendedWaitUntil:
    visible: El correo o la contraseña no son correctos.
    timeout: 20000
