appId: com.bradlopez13.casa
---
- clearState
# Android can kill the first start while the cleared task is still being removed: retry it.
- retry:
    maxRetries: 2
    commands:
      - launchApp:
          stopApp: true
      - extendedWaitUntil:
          visible:
            id: sign-in.email
          timeout: 30000

# Sign in as Iris, a fixture user with no household yet
- runFlow:
    file: subflows/sign-in.yaml
    env:
      EMAIL: iris@e2e.dev

# Onboarding: no household yet -> delete the account from the account menu
- extendedWaitUntil:
    visible:
      id: onboarding.name
    timeout: 20000
- tapOn:
    id: account-menu
- tapOn:
    id: account-menu.delete-account
- tapOn:
    id: delete-account.confirm
- extendedWaitUntil:
    visible:
      id: sign-in.email
    timeout: 20000

# The deleted account can no longer sign in
- tapOn:
    id: sign-in.email
- inputText: iris@e2e.dev
- tapOn:
    id: sign-in.password
- inputText: e2e-password-2026
- hideKeyboard
- scrollUntilVisible:
    element:
      id: sign-in.submit
- tapOn:
    id: sign-in.submit
- extendedWaitUntil:
    visible: El correo o la contraseña no coinciden. Revísalos o recupera la contraseña.
    timeout: 20000
