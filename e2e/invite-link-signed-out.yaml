appId: com.bradlopez13.casa
---
# Needs the fixtures: DEEPLINK_TOKEN = c3 x 24 (see supabase/e2e/fixtures.sql).
- launchApp:
    clearState: true
# Wait for the app to be ready first: a link opened during startup can be dropped.
- extendedWaitUntil:
    visible:
      id: sign-in.go-sign-up
    timeout: 30000
- evalScript: ${output.email = 'carla' + Date.now() + '@e2e.dev'}

# Open the invite link while signed out. The sign-in screen is already up, so it is no signal that
# the link was handled. The invite screen shows briefly, stores the token and redirects to
# sign-in: catch it if we can (optional), wait until it is gone, then look at the sign-in form,
# so nothing is tapped before the redirect has finished.
- openLink: casa://invite?token=c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3
- extendedWaitUntil:
    visible:
      id: invite.accept
    timeout: 5000
    optional: true
- extendedWaitUntil:
    notVisible:
      id: invite.accept
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: sign-in.go-sign-up
    timeout: 30000
- tapOn:
    id: sign-in.go-sign-up
- tapOn:
    id: sign-up.name
- inputText: Carla
- tapOn:
    id: sign-up.email
- inputText: ${output.email}
- tapOn:
    id: sign-up.password
- inputText: e2e-password-2026
- hideKeyboard
- tapOn:
    id: sign-up.submit

# The pending invite survives the sign-up: the invite screen shows, not the onboarding
- extendedWaitUntil:
    visible:
      id: invite.accept
    timeout: 20000
- assertNotVisible:
    id: onboarding.create
- tapOn:
    id: invite.accept
- extendedWaitUntil:
    visible:
      id: today.household-name
      text: Casa E2E
    timeout: 20000
