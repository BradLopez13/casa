appId: com.bradlopez13.casa
---
# Needs the fixtures: DEEPLINK_TOKEN = c3 x 24 (see supabase/e2e/fixtures.sql).
- launchApp:
    clearState: true
- evalScript: ${output.email = 'carla' + Date.now() + '@e2e.dev'}

# Open the invite link right after launch, while signed out. The invite screen stores the token
# and redirects to sign-in; wait for the sign-in form and for the invite screen to be gone, so
# nothing is tapped before the redirect has finished.
- openLink: casa://invite?token=c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3
- extendedWaitUntil:
    visible:
      id: sign-in.email
    timeout: 30000
- assertNotVisible:
    id: invite.accept
- assertNotVisible:
    id: invite.error
- tapOn:
    id: sign-in.go-sign-up
- tapOn:
    id: sign-up.name
- inputText: Carla
- tapOn:
    id: sign-up.email
- inputText: ${output.email}
- tapOn:
    id: sign-up.password
- inputText: e2e-password-2026
- hideKeyboard
- tapOn:
    id: sign-up.submit

# The pending invite survives the sign-up: the invite screen shows, not the onboarding
- extendedWaitUntil:
    visible:
      id: invite.accept
    timeout: 20000
- assertNotVisible:
    id: onboarding.create
- tapOn:
    id: invite.accept
- extendedWaitUntil:
    visible:
      id: today.household-name
      text: Casa E2E
    timeout: 20000
