appId: com.bradlopez13.casa
---
# Needs the fixtures: DEEPLINK_TOKEN = c3 x 24 (see supabase/e2e/fixtures.sql).
- clearState
# Wait for the app to be ready first: a link opened during startup can be dropped.
# Android can kill the first start while the cleared task is still being removed: retry it.
- retry:
    maxRetries: 2
    commands:
      - launchApp:
          stopApp: true
      - extendedWaitUntil:
          visible:
            id: sign-in.email
          timeout: 30000
- evalScript: ${output.email = 'carla' + Date.now() + '@e2e.dev'}

# Open the invite link while signed out. The invite screen stores the token and redirects to
# sign-in, which then shows the pending-invite notice: that notice is the signal that the
# redirect is done and the token is stored.
- openLink: casa://invite?token=c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3
- extendedWaitUntil:
    visible:
      id: sign-in.pending-invite
    timeout: 30000
# On a small screen the keyboard or the brand header can leave this field below the fold.
- scrollUntilVisible:
    element:
      id: sign-in.go-sign-up
- tapOn:
    id: sign-in.go-sign-up
- extendedWaitUntil:
    visible:
      id: sign-up.pending-invite
    timeout: 20000
- tapOn:
    id: sign-up.name
- inputText: Carla
- tapOn:
    id: sign-up.email
- inputText: ${output.email}
# On a small screen the keyboard or the brand header can leave this field below the fold.
- scrollUntilVisible:
    element:
      id: sign-up.password
- tapOn:
    id: sign-up.password
- inputText: e2e-password-2026
- hideKeyboard
# On a small screen the keyboard or the brand header can leave this field below the fold.
- scrollUntilVisible:
    element:
      id: sign-up.password-confirm
- tapOn:
    id: sign-up.password-confirm
- inputText: e2e-password-2026
- hideKeyboard
- scrollUntilVisible:
    element:
      id: sign-up.submit
- tapOn:
    id: sign-up.submit
- runFlow: subflows/verify-email.yaml

# The pending invite survives the sign-up: the invite screen shows, not the onboarding
- extendedWaitUntil:
    visible:
      id: invite.accept
    timeout: 20000
- assertNotVisible:
    id: onboarding.create
- tapOn:
    id: invite.accept
- extendedWaitUntil:
    visible:
      id: today.household-name
      text: Casa E2E
    timeout: 20000
