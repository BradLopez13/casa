appId: com.bradlopez13.casa
---
- clearState
# Android can kill the first start while the cleared task is still being removed: retry it.
- retry:
    maxRetries: 2
    commands:
      - launchApp:
          stopApp: true
      - extendedWaitUntil:
          visible:
            id: sign-in.email
          timeout: 30000
- evalScript: ${output.email = 'zoe' + Date.now() + '@e2e.dev'}

# Sign up
# On a small screen the keyboard or the brand header can leave this field below the fold.
- scrollUntilVisible:
    element:
      id: sign-in.go-sign-up
- tapOn:
    id: sign-in.go-sign-up
- tapOn:
    id: sign-up.name
- inputText: Zoe
- tapOn:
    id: sign-up.email
- inputText: ${output.email}
# On a small screen the keyboard or the brand header can leave this field below the fold.
- scrollUntilVisible:
    element:
      id: sign-up.password
- tapOn:
    id: sign-up.password
- inputText: e2e-password-2026
- hideKeyboard
# On a small screen the keyboard or the brand header can leave this field below the fold.
- scrollUntilVisible:
    element:
      id: sign-up.password-confirm
- tapOn:
    id: sign-up.password-confirm
- inputText: e2e-password-2026
- hideKeyboard
- scrollUntilVisible:
    element:
      id: sign-up.submit
- tapOn:
    id: sign-up.submit
- runFlow: subflows/verify-email.yaml

# Onboarding: create the household
- extendedWaitUntil:
    visible:
      id: onboarding.name
    timeout: 20000
- tapOn:
    id: onboarding.name
- eraseText: 60
- inputText: Piso Zoe
- hideKeyboard
- tapOn:
    id: onboarding.create
- extendedWaitUntil:
    visible:
      id: today.household-name
      text: Piso Zoe
    timeout: 20000

# Settings -> members -> copy link -> pending invite -> revoke
- tapOn:
    id: tab.settings
- tapOn:
    id: settings.members
- extendedWaitUntil:
    visible:
      id: members.copy-link
    timeout: 20000
- tapOn:
    id: members.copy-link
- extendedWaitUntil:
    visible:
      id: members.copied
    timeout: 20000
# The "copied" notice disappears after a moment and the rows move up: wait for it to go first.
- extendedWaitUntil:
    notVisible:
      id: members.copied
    timeout: 10000
- scrollUntilVisible:
    element:
      id: members\.revoke\..*
# The list refetches right after the copy: a tap during that re-render can be lost, so retry it.
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          id: members\.revoke\..*
      - extendedWaitUntil:
          visible: No hay invitaciones pendientes.
          timeout: 10000
- assertNotVisible: Revocar

# Delete the household -> back to onboarding
- scrollUntilVisible:
    element:
      id: members.delete-household
- tapOn:
    id: members.delete-household
- tapOn:
    id: members.confirm
- extendedWaitUntil:
    visible:
      id: onboarding.create
    timeout: 20000
