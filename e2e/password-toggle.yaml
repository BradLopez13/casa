appId: com.bradlopez13.casa
---
- clearState
# Android can kill the first start while the cleared task is still being removed: retry it.
- retry:
    maxRetries: 2
    commands:
      - launchApp:
          stopApp: true
      - extendedWaitUntil:
          visible:
            id: sign-in.go-sign-up
          timeout: 30000

# The eye reveals and hides what was typed
- tapOn:
    id: sign-in.password
- inputText: e2e-visible-2026
- hideKeyboard
- tapOn:
    id: sign-in.password.toggle
- assertVisible: e2e-visible-2026
- tapOn:
    id: sign-in.password.toggle
- assertNotVisible: e2e-visible-2026
