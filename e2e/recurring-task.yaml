appId: com.bradlopez13.casa
---
- clearState
# Android can kill the first start while the cleared task is still being removed: retry it.
- retry:
    maxRetries: 2
    commands:
      - launchApp:
          stopApp: true
      - extendedWaitUntil:
          visible:
            id: sign-in.email
          timeout: 30000

# Sign in as Rita, a fixture user who already owns "Piso Rita"
- runFlow:
    file: subflows/sign-in.yaml
    env:
      EMAIL: rita@e2e.dev
- extendedWaitUntil:
    visible:
      id: today.door-line
    timeout: 20000

# Create the task from the quick add, then make it daily in its form
- tapOn:
    id: today.quick-add
- inputText: Sacar la basura
- tapOn:
    id: today.quick-add.submit
- hideKeyboard
- extendedWaitUntil:
    visible: Sacar la basura
    timeout: 20000
# A note still on its way to the server does not open: tap again until the form shows.
- retry:
    maxRetries: 3
    commands:
      - tapOn: Sacar la basura
      - extendedWaitUntil:
          visible:
            id: task-form.title
          timeout: 5000
# The repeat magnet opens its own picker in the form.
- tapOn:
    id: task-form.prop.repeat
- scrollUntilVisible:
    element:
      id: task-form.repeat.daily
- tapOn:
    id: task-form.repeat.daily
- tapOn:
    id: task-form.save
- extendedWaitUntil:
    visible: Sacar la basura
    timeout: 20000

# Complete it: the note moves to the done tray
- tapOn: Completar «Sacar la basura»
- extendedWaitUntil:
    visible: Hechas hoy
    timeout: 20000

# Tareas opens in the week view: tomorrow's cell in the day strip counts the next occurrence
# (its label reads «Mañana, 1 tarea: Tú»), and choosing it shows the task.
- tapOn:
    id: tab.tasks
- extendedWaitUntil:
    visible: Mañana, 1 tarea.*
    timeout: 20000
- tapOn: Mañana, 1 tarea.*
- extendedWaitUntil:
    visible: Sacar la basura
    timeout: 20000

# Reopen it from the done tray: it goes back to "Para hoy"
- tapOn:
    id: tab.today
- tapOn: Reabrir «Sacar la basura».*
- extendedWaitUntil:
    visible: Para hoy
    timeout: 20000

# The successor for tomorrow is gone again once the list refetches: tomorrow counts none
- tapOn:
    id: tab.tasks
- extendedWaitUntil:
    visible: Mañana, 0 tareas
    timeout: 20000
