# Types the 6-digit code that sign-up emailed to ${output.email} (read from Mailpit) and confirms.
# Run right after tapping sign-up.submit.
appId: com.bradlopez13.casa
---
- extendedWaitUntil:
    visible:
      id: verify-email.code
    timeout: 15000
- runScript:
    file: ../scripts/read-email-code.js
    env:
      EMAIL: ${output.email}
# On a small screen the brand header can push this element below the fold.
- scrollUntilVisible:
    element:
      id: verify-email.code
- tapOn:
    id: verify-email.code
- inputText: ${output.code}
- hideKeyboard
# On a small screen the brand header can push this element below the fold.
- scrollUntilVisible:
    element:
      id: verify-email.submit
- tapOn:
    id: verify-email.submit
