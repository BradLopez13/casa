appId: com.bradlopez13.casa
---
- clearState
# Android can kill the first start while the cleared task is still being removed: retry it.
- retry:
    maxRetries: 2
    commands:
      - launchApp:
          stopApp: true
      - extendedWaitUntil:
          visible:
            id: sign-in.email
          timeout: 30000

# Sign in as Sara, a fixture user who already owns "Piso Sara"
- runFlow:
    file: subflows/sign-in.yaml
    env:
      EMAIL: sara@e2e.dev
- extendedWaitUntil:
    visible:
      id: today.door-line
    timeout: 20000

# Add "Leche" from the field on the door
- tapOn:
    id: tab.shopping
- extendedWaitUntil:
    visible: No falta nada.
    timeout: 20000
- tapOn:
    id: shopping.input
- inputText: Leche
- tapOn:
    id: shopping.add
- extendedWaitUntil:
    visible: Leche
    timeout: 20000

# The same name again (in any case) is not added twice
- tapOn:
    id: shopping.input
- inputText: leche
- tapOn:
    id: shopping.add
- extendedWaitUntil:
    visible: Ya está en la lista
    timeout: 20000
- hideKeyboard

# Mark it as bought: it moves under "En la bolsa"
- tapOn: Marcar «Leche» como comprado
- extendedWaitUntil:
    visible: En la bolsa \(1\)
    timeout: 20000

# Clear the bought ones: the section goes away (it fades out after the server answers)
- tapOn:
    id: shopping.clear
- extendedWaitUntil:
    notVisible: En la bolsa.*
    timeout: 20000
- assertNotVisible: En la bolsa.*

# The history suggests it again while typing
- tapOn:
    id: shopping.input
- inputText: le
- extendedWaitUntil:
    visible:
      id: shopping.suggestion.leche
    timeout: 20000
